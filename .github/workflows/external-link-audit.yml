name: External Link Audit

on:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:
  pull_request:

permissions:
  contents: read

jobs:
  links:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Check external links
        run: python scripts/audit_external_links.py
