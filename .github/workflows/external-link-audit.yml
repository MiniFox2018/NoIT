name: External Link Audit

on:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  links:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Check external links
        env:
          NOIT_LINK_AUDIT_REPORT: ${{ runner.temp }}/noit-external-links.json
        run: python scripts/audit_external_links.py
      - name: Upload link audit snapshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: noit-external-links-${{ github.run_id }}
          path: ${{ runner.temp }}/noit-external-links.json
          if-no-files-found: warn
          retention-days: 90
