name: Repository Audit

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Compile audit scripts
        run: python -m py_compile scripts/audit_repository.py scripts/audit_external_links.py
      - name: Run repository audit
        run: python scripts/audit_repository.py
